<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Pair App - Execution</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .exec-task-card {
      text-align: center;
      padding: 24px 16px;
    }
    .exec-task-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .exec-task-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .exec-meta {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .timer-card {
      text-align: center;
      padding: 24px;
    }
    .timer-status {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .timer-status.idle { color: var(--text-secondary); }
    .timer-status.running { color: var(--accent); }
    .timer-status.finished { color: var(--success); }
    .timer-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
    }
    .exec-history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--divider);
    }
    .exec-history-item:last-child { border-bottom: none; }
    .exec-history-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .exec-history-info { flex: 1; }
    .exec-history-info .exec-name { font-size: 14px; font-weight: 600; }
    .exec-history-info .exec-time { font-size: 12px; color: var(--text-secondary); }
    .exec-history-duration {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }
    .pending-task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--divider);
      cursor: pointer;
      transition: var(--transition);
    }
    .pending-task-item:hover { background: rgba(0,151,167,0.04); }
    .pending-task-item:last-child { border-bottom: none; }
    .pending-task-item .pt-info { flex: 1; }
    .pending-task-item .pt-name { font-size: 14px; font-weight: 600; }
    .pending-task-item .pt-meta { font-size: 12px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="content"></div>
  </div>

  <script src="app.js"></script>
  <script>
    let timerInterval = null;
    let timerSeconds = 0;
    let timerRunning = false;
    let selectedTaskIndex = 0;

    document.addEventListener('DOMContentLoaded', function() {
      renderTopBar('Task Execution', { backPage: 'dashboard.html' });
      renderBottomNav('execution.html');
      render();
    });

    function render() {
      const pendingTasks = MockData.tasks.filter(t =>
        (t.status === 'pending' || t.status === 'in_progress') && t.executorId === 'user1'
      );
      const task = pendingTasks[selectedTaskIndex] || pendingTasks[0];
      const history = MockData.executions.filter(e => e.finishedAt);

      const content = document.getElementById('content');
      content.innerHTML = `
        <!-- Current Task Execution -->
        ${task ? `
          <div class="card exec-task-card">
            <div class="exec-task-name">${task.name}</div>
            <div class="exec-task-desc">${task.description}</div>
            <div class="exec-meta">
              <span class="chip">⏱️ ${task.expectedDuration} min expected</span>
              <span class="chip" style="background:#FFF3E0; color:#E65100">⭐ ${task.points} pts</span>
              <span class="chip">${recurrenceLabel(task.recurrence)}</span>
            </div>
          </div>

          <!-- Timer -->
          <div class="card timer-card">
            <div class="timer-status ${timerRunning ? 'running' : timerSeconds > 0 ? 'finished' : 'idle'}">
              ${timerRunning ? '⏱️ Timer Running...' : timerSeconds > 0 ? '✅ Task Completed!' : 'Ready to Start'}
            </div>
            <div class="timer-display ${timerRunning ? 'running' : ''}" id="timerDisplay">
              ${formatTime(timerSeconds)}
            </div>
            <div class="progress-bar" style="margin-bottom:16px">
              <div class="progress-fill ${timerSeconds >= task.expectedDuration * 60 ? '' : 'green'}"
                   id="timerProgress"
                   style="width: ${Math.min((timerSeconds / (task.expectedDuration * 60)) * 100, 100)}%">
              </div>
            </div>
            <div class="timer-buttons">
              ${!timerRunning && timerSeconds === 0 ? `
                <button class="btn btn-primary" onclick="startTimer()">▶️ Start</button>
              ` : timerRunning ? `
                <button class="btn btn-accent" onclick="stopTimer()">⏸️ Pause</button>
                <button class="btn btn-success" onclick="finishTimer()">✅ Finish</button>
              ` : `
                <button class="btn btn-primary" onclick="startTimer()">▶️ Resume</button>
                <button class="btn btn-success" onclick="finishExecution()">📤 Submit</button>
              `}
            </div>
          </div>

          <!-- Notes -->
          <div class="card">
            <div class="form-group" style="margin-bottom:0">
              <label>Execution Notes</label>
              <textarea id="execNotes" class="form-control" placeholder="Add notes about this execution..."></textarea>
            </div>
          </div>
        ` : `
          <div class="card">
            <div class="empty-state">
              <div class="empty-icon">🎉</div>
              <p>No pending tasks to execute!</p>
            </div>
          </div>
        `}

        <!-- Pending Tasks Queue -->
        ${pendingTasks.length > 1 ? `
          <div class="section-header">
            <h2>Task Queue</h2>
          </div>
          <div class="card" style="padding:0; overflow:hidden">
            ${pendingTasks.map((t, i) => `
              <div class="pending-task-item ${i === selectedTaskIndex ? 'style="background:var(--primary-light)"' : ''}" onclick="selectTask(${i})">
                <div style="font-size:20px">${i === selectedTaskIndex ? '▶️' : '⏸️'}</div>
                <div class="pt-info">
                  <div class="pt-name">${t.name}</div>
                  <div class="pt-meta">${t.scheduledTime} · ${t.expectedDuration} min · ${t.points} pts</div>
                </div>
                ${statusBadge(t.status)}
              </div>
            `).join('')}
          </div>
        ` : ''}

        <!-- Execution History -->
        <div class="section-header">
          <h2>Recent Executions</h2>
        </div>
        <div class="card" style="padding:0; overflow:hidden">
          ${history.length > 0 ? history.map(e => {
            const task = MockData.tasks.find(t => t.id === e.taskId);
            return `
              <div class="exec-history-item">
                <div class="exec-history-icon" style="background:var(--primary-light); color:var(--primary)">✅</div>
                <div class="exec-history-info">
                  <div class="exec-name">${task ? task.name : 'Unknown Task'}</div>
                  <div class="exec-time">${e.finishedAt} · ${e.notes || 'No notes'}</div>
                </div>
                <div class="exec-history-duration">${e.duration} min</div>
              </div>
            `;
          }).join('') : `
            <div class="empty-state">
              <div class="empty-icon">📜</div>
              <p>No execution history yet</p>
            </div>
          `}
        </div>
      `;
    }

    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function startTimer() {
      timerRunning = true;
      timerInterval = setInterval(() => {
        timerSeconds++;
        const display = document.getElementById('timerDisplay');
        const progress = document.getElementById('timerProgress');
        if (display) display.textContent = formatTime(timerSeconds);
        const pendingTasks = MockData.tasks.filter(t =>
          (t.status === 'pending' || t.status === 'in_progress') && t.executorId === 'user1'
        );
        const task = pendingTasks[selectedTaskIndex];
        if (progress && task) {
          progress.style.width = Math.min((timerSeconds / (task.expectedDuration * 60)) * 100, 100) + '%';
        }
      }, 1000);
      render();
    }

    function stopTimer() {
      timerRunning = false;
      clearInterval(timerInterval);
      render();
    }

    function finishTimer() {
      timerRunning = false;
      clearInterval(timerInterval);
      render();
    }

    function finishExecution() {
      showToast('Task submitted for validation! ✅');
      timerSeconds = 0;
      timerRunning = false;
      clearInterval(timerInterval);
      setTimeout(() => render(), 600);
    }

    function selectTask(index) {
      selectedTaskIndex = index;
      timerSeconds = 0;
      timerRunning = false;
      clearInterval(timerInterval);
      render();
    }
  </script>
</body>
</html>
